<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Paintball Taster-Sound - Einrichtung</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f4f7;
    --surface: #ffffff;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e3e5eb;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-contrast: #ffffff;
    --success-bg: #ecfdf3;
    --success-text: #027a48;
    --success-border: #a6e9c4;
    --error-bg: #fef3f2;
    --error-text: #b42318;
    --error-border: #fda29b;
    --radius-lg: 16px;
    --radius-md: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101217;
      --surface: #1a1d24;
      --text: #e7e9ee;
      --text-muted: #9aa1ac;
      --border: #2b2f38;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --success-bg: rgba(16, 185, 129, 0.14);
      --success-text: #34d399;
      --success-border: rgba(52, 211, 153, 0.35);
      --error-bg: rgba(248, 113, 113, 0.14);
      --error-text: #f87171;
      --error-border: rgba(248, 113, 113, 0.35);
    }
  }

  * { box-sizing: border-box; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 1rem 1rem 6.5rem;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    margin: 0.25rem 0 1.5rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  header svg { flex: none; }

  header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
  }

  header p {
    margin: 0.15rem 0 0;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .lang-switch {
    flex: none;
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    margin-top: 0.15rem;
  }

  .lang-btn {
    width: auto;
    min-height: 0;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 0.3rem 0.65rem;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted);
  }

  .lang-btn:hover:not(:disabled) { background: transparent; color: var(--text); }

  .lang-btn.active,
  .lang-btn.active:hover {
    background: var(--primary);
    color: var(--primary-contrast);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.1rem 1.25rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 0.9rem;
  }

  .step-badge {
    flex: none;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: var(--primary);
    color: var(--primary-contrast);
    font-size: 0.85rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-hint {
    margin: -0.4rem 0 0.9rem;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }

  input[type=text],
  input[type=number] {
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 0.65rem 0.75rem;
    width: 100%;
  }

  input[type=text]:focus,
  input[type=number]:focus,
  input[type=file]:focus-visible {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
  }

  input[type=number] { width: 6.5rem; text-align: right; }

  input[type=file] {
    display: block;
    width: 100%;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  input[type=file]::file-selector-button {
    font: inherit;
    font-weight: 600;
    color: var(--primary-contrast);
    background: var(--primary);
    border: none;
    border-radius: var(--radius-md);
    padding: 0.55rem 0.9rem;
    margin-right: 0.75rem;
    cursor: pointer;
  }

  input[type=file]::file-selector-button:hover { background: var(--primary-hover); }

  .quota-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }

  #quota.over { color: var(--error-text); font-weight: 600; }

  .quota-bar {
    height: 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .quota-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 0.25s ease, background-color 0.25s ease;
  }

  .quota-fill.over { background: var(--error-text); }

  button {
    font: inherit;
    font-weight: 600;
    color: var(--primary-contrast);
    background: var(--primary);
    border: none;
    border-radius: var(--radius-md);
    padding: 0.7rem 1.1rem;
    min-height: 2.75rem;
    cursor: pointer;
    width: 100%;
  }

  button:hover:not(:disabled) { background: var(--primary-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  #uploadBtn {
    background: var(--surface);
    color: var(--primary);
    border: 1px solid var(--primary);
    margin-top: 0.85rem;
  }

  #uploadBtn:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 8%, transparent); }

  #uploadStatus {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 0.6rem 0 0;
    min-height: 1.1em;
  }

  #mappingTable { width: 100%; border-collapse: collapse; }

  #mappingTable, #mappingTable thead, #mappingTable tbody,
  #mappingTable tr, #mappingTable th, #mappingTable td {
    display: block;
  }

  #mappingTable thead { display: none; }

  #mappingTable tbody tr {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.5rem;
  }

  #mappingTable tbody tr:last-child { margin-bottom: 0; }

  #mappingTable td {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.25rem 0;
    border: none;
  }

  #mappingTable td::before {
    content: attr(data-label);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    flex: none;
  }

  #mappingTable td.file-cell {
    font-weight: 600;
    word-break: break-all;
    text-align: right;
  }

  #mappingTable td.file-cell::before { text-align: left; }

  .file-size {
    font-weight: 400;
    color: var(--text-muted);
    font-size: 0.85em;
  }

  #mappingTable td.order-cell {
    justify-content: flex-end;
    gap: 0.4rem;
  }

  #mappingTable td.order-cell::before { content: none; }

  .order-btn {
    width: 2.25rem;
    min-height: 2.25rem;
    padding: 0;
    font-size: 0.9rem;
    line-height: 1;
    flex: none;
  }

  .delete-btn {
    background: transparent;
    color: var(--error-text);
    border: 1px solid var(--error-border);
  }

  .delete-btn:hover:not(:disabled) { background: var(--error-bg); }

  .empty-row td {
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-style: italic;
  }

  .empty-row td::before { content: none; }

  .action-bar {
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    margin: 1.5rem -1rem -6.5rem;
    padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
  }

  .action-bar-inner { max-width: 560px; margin: 0 auto; }

  #status {
    margin-top: 0.7rem;
    padding: 0.6rem 0.75rem;
    border-radius: var(--radius-md);
    font-size: 0.85rem;
    display: none;
  }

  #status.ok, #status.error { display: block; }

  #status.ok {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid var(--success-border);
  }

  #status.error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
  }

  @media (min-width: 600px) {
    body { padding: 2.5rem 1.5rem 7rem; }

    #mappingTable thead { display: table-header-group; }
    #mappingTable { display: table; }
    #mappingTable tbody { display: table-row-group; }
    #mappingTable tr { display: table-row; }
    #mappingTable th, #mappingTable td { display: table-cell; }

    #mappingTable th, #mappingTable td {
      text-align: left;
      padding: 0.55rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    #mappingTable th { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
    #mappingTable tbody tr { background: none; border: none; border-radius: 0; padding: 0; margin: 0; }
    #mappingTable td::before { content: none; }
    #mappingTable td.file-cell { text-align: left; }
    #mappingTable td.order-cell { justify-content: flex-start; }
    .empty-row td { text-align: center; padding: 1rem 0.5rem; }

    #uploadBtn, #saveBtn { width: auto; }
  }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="17" cy="17" r="16" stroke="#2563eb" stroke-width="2"/>
      <circle cx="17" cy="17" r="10.5" stroke="#2563eb" stroke-width="2"/>
      <circle cx="17" cy="17" r="4" fill="#2563eb"/>
    </svg>
    <div>
      <h1 id="appName">Paintball Taster-Sound</h1>
      <p id="appSubtitle">Einrichtung</p>
    </div>
  </div>
  <div class="lang-switch" role="group" aria-label="Language / Sprache">
    <button type="button" class="lang-btn" data-lang="de">DE</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<section class="card">
  <h2 class="card-title"><span class="step-badge">1</span> <span id="step1Title">Bluetooth-Box</span></h2>
  <label for="btName" id="btNameLabel">Name der Bluetooth-Box (exakt wie beim Pairing sichtbar)</label>
  <input type="text" id="btName" placeholder="z.B. UE BOOM 2" autocomplete="off">
</section>

<section class="card">
  <h2 class="card-title"><span class="step-badge">2</span> <span id="step2Title">MP3-Dateien</span></h2>
  <div class="quota-row">
    <span id="quota">Belegt: 0 / 0 Bytes</span>
  </div>
  <div class="quota-bar"><div class="quota-fill" id="quotaFill"></div></div>
  <input type="file" id="fileInput" accept=".mp3,audio/mpeg" multiple>
  <button id="uploadBtn" type="button">Ausgewählte Dateien hochladen</button>
  <p id="uploadStatus"></p>
</section>

<section class="card">
  <h2 class="card-title"><span class="step-badge">3</span> <span id="step3Title">Tastendruck-Mapping</span></h2>
  <p class="card-hint" id="mappingHint">Pro Datei die Obergrenze in Millisekunden angeben (bis einschließlich). Die letzte Zeile deckt alles darüber ab.</p>
  <table id="mappingTable">
    <thead><tr><th id="colFile">Datei</th><th id="colFrom">Von (ms)</th><th id="colTo">Bis (ms)</th><th id="colOrder"><span class="sr-only">Reihenfolge</span></th></tr></thead>
    <tbody></tbody>
  </table>
</section>

</div>

<div class="action-bar">
  <div class="action-bar-inner">
    <button id="saveBtn" type="button">Speichern &amp; Neustart</button>
    <div id="status"></div>
  </div>
</div>

<script>
// Muss mit MAX_TOTAL_MP3_BYTES in src/ap_setup.cpp uebereinstimmen.
const MAX_TOTAL_MP3_BYTES = 1500000;

const STRINGS = {
  de: {
    pageTitle: 'Paintball Taster-Sound - Einrichtung',
    appName: 'Paintball Taster-Sound',
    appSubtitle: 'Einrichtung',
    step1Title: 'Bluetooth-Box',
    btNameLabel: 'Name der Bluetooth-Box (exakt wie beim Pairing sichtbar)',
    btNamePlaceholder: 'z.B. UE BOOM 2',
    step2Title: 'MP3-Dateien',
    uploadBtn: 'Ausgewählte Dateien hochladen',
    step3Title: 'Tastendruck-Mapping',
    mappingHint: 'Pro Datei die Obergrenze in Millisekunden angeben (bis einschließlich). Die letzte Zeile deckt alles darüber ab. Mit den Pfeil-Buttons lässt sich die Reihenfolge der Dateien ändern.',
    colFile: 'Datei',
    colFrom: 'Von (ms)',
    colTo: 'Bis (ms)',
    colOrder: 'Aktionen',
    unlimited: 'unbegrenzt',
    moveUp: 'Nach oben verschieben',
    moveDown: 'Nach unten verschieben',
    deleteFile: (name) => `${name} löschen`,
    confirmDelete: (name) => `"${name}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`,
    emptyMapping: 'Noch keine Dateien hochgeladen.',
    saveBtn: 'Speichern & Neustart',
    quota: (used, max) => `Belegt: ${used} / ${max}`,
    uploadCancelled: (size) => `Abgebrochen: Gesamtgröße (${size}) würde das 1,5-MB-Limit überschreiten.`,
    uploading: (name) => `Lade hoch: ${name} ...`,
    uploadError: (name, msg) => `Fehler bei ${name}: ${msg}`,
    uploadDone: 'Fertig.',
    deleteError: (name, msg) => `Fehler beim Löschen von ${name}: ${msg}`,
    needBtName: 'Bitte den Namen der Bluetooth-Box angeben.',
    needFile: 'Bitte mindestens eine MP3-Datei hochladen.',
    needValidTo: (name, min) => `Bitte für "${name}" einen gültigen "Bis"-Wert (>= ${min}) angeben.`,
    saveError: (e) => `Fehler beim Speichern: ${e}`,
    errorCodes: {
      FILE_CREATE_FAILED: 'Datei konnte nicht angelegt werden',
      SIZE_EXCEEDED: 'Gesamtgröße aller MP3-Dateien würde 1,5 MB überschreiten',
      BT_NAME_REQUIRED: 'Bluetooth-Boxname darf nicht leer sein',
      MAPPING_INVALID: 'Mapping-Tabelle fehlt oder ist ungültig (mindestens eine MP3-Datei hochladen)',
      SAVED: 'Gespeichert. Gerät startet neu...',
      INVALID_NAME: 'Ungültiger Dateiname',
      NOT_FOUND: 'Datei nicht gefunden (evtl. schon gelöscht)',
    },
  },
  en: {
    pageTitle: 'Paintball Start Buzzer - Setup',
    appName: 'Paintball Start Buzzer',
    appSubtitle: 'Setup',
    step1Title: 'Bluetooth Speaker',
    btNameLabel: 'Name of the Bluetooth speaker (exactly as shown when pairing)',
    btNamePlaceholder: 'e.g. UE BOOM 2',
    step2Title: 'MP3 Files',
    uploadBtn: 'Upload selected files',
    step3Title: 'Button Press Mapping',
    mappingHint: 'For each file, enter the upper bound in milliseconds (inclusive). The last row covers everything above that. Use the arrow buttons to change the order of the files.',
    colFile: 'File',
    colFrom: 'From (ms)',
    colTo: 'To (ms)',
    colOrder: 'Actions',
    unlimited: 'unlimited',
    moveUp: 'Move up',
    moveDown: 'Move down',
    deleteFile: (name) => `Delete ${name}`,
    confirmDelete: (name) => `Really delete "${name}"? This can't be undone.`,
    emptyMapping: 'No files uploaded yet.',
    saveBtn: 'Save & Restart',
    quota: (used, max) => `Used: ${used} / ${max}`,
    uploadCancelled: (size) => `Cancelled: total size (${size}) would exceed the 1.5 MB limit.`,
    uploading: (name) => `Uploading: ${name} ...`,
    uploadError: (name, msg) => `Error with ${name}: ${msg}`,
    uploadDone: 'Done.',
    deleteError: (name, msg) => `Error deleting ${name}: ${msg}`,
    needBtName: 'Please enter the name of the Bluetooth speaker.',
    needFile: 'Please upload at least one MP3 file.',
    needValidTo: (name, min) => `Please enter a valid "To" value (>= ${min}) for "${name}".`,
    saveError: (e) => `Error while saving: ${e}`,
    errorCodes: {
      FILE_CREATE_FAILED: 'Could not create the file',
      SIZE_EXCEEDED: 'Total size of all MP3 files would exceed 1.5 MB',
      BT_NAME_REQUIRED: 'Bluetooth speaker name must not be empty',
      MAPPING_INVALID: 'Mapping table is missing or invalid (upload at least one MP3 file)',
      SAVED: 'Saved. Device is restarting...',
      INVALID_NAME: 'Invalid file name',
      NOT_FOUND: 'File not found (may already be deleted)',
    },
  },
};

let lang = localStorage.getItem('pbSetupLang') || 'de';
let lastQuotaTotal = 0;

function t(key, ...args) {
  const entry = STRINGS[lang][key];
  return typeof entry === 'function' ? entry(...args) : entry;
}

function errorText(code) {
  return STRINGS[lang].errorCodes[code] || code;
}

function applyStaticTranslations() {
  document.documentElement.lang = lang;
  document.title = t('pageTitle');
  document.getElementById('appName').textContent = t('appName');
  document.getElementById('appSubtitle').textContent = t('appSubtitle');
  document.getElementById('step1Title').textContent = t('step1Title');
  document.getElementById('btNameLabel').textContent = t('btNameLabel');
  document.getElementById('btName').placeholder = t('btNamePlaceholder');
  document.getElementById('step2Title').textContent = t('step2Title');
  document.getElementById('uploadBtn').textContent = t('uploadBtn');
  document.getElementById('step3Title').textContent = t('step3Title');
  document.getElementById('mappingHint').textContent = t('mappingHint');
  document.getElementById('colFile').textContent = t('colFile');
  document.getElementById('colFrom').textContent = t('colFrom');
  document.getElementById('colTo').textContent = t('colTo');
  document.querySelector('#colOrder .sr-only').textContent = t('colOrder');
  document.getElementById('saveBtn').textContent = t('saveBtn');

  document.querySelectorAll('.lang-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

function setLang(newLang) {
  lang = newLang;
  localStorage.setItem('pbSetupLang', lang);
  applyStaticTranslations();
  updateQuotaDisplay(lastQuotaTotal);
  renderMappingTable();
}

document.querySelectorAll('.lang-btn').forEach((btn) => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

let uploadedFiles = [];   // [{name, size}], confirmed by the server
let bisValues = {};       // name -> number (ms), from existing mapping or user input

function formatBytes(n) {
  return (n / 1000).toFixed(1) + ' kB';
}

function updateQuotaDisplay(total) {
  lastQuotaTotal = total;
  const el = document.getElementById('quota');
  const fill = document.getElementById('quotaFill');
  const over = total > MAX_TOTAL_MP3_BYTES;
  el.textContent = t('quota', formatBytes(total), formatBytes(MAX_TOTAL_MP3_BYTES));
  el.classList.toggle('over', over);
  const pct = Math.max(0, Math.min(100, (total / MAX_TOTAL_MP3_BYTES) * 100));
  fill.style.width = pct + '%';
  fill.classList.toggle('over', over);
}

function moveFile(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= uploadedFiles.length) return;
  [uploadedFiles[index], uploadedFiles[target]] = [uploadedFiles[target], uploadedFiles[index]];
  renderMappingTable();
}

async function deleteFile(index) {
  const file = uploadedFiles[index];
  if (!confirm(t('confirmDelete', file.name))) return;

  const statusEl = document.getElementById('uploadStatus');
  try {
    const body = new URLSearchParams();
    body.set('name', file.name);
    const res = await fetch('/delete', { method: 'POST', body });
    if (!res.ok) {
      const code = await res.text();
      statusEl.textContent = t('deleteError', file.name, errorText(code));
      return;
    }
    delete bisValues[file.name];
    statusEl.textContent = '';
    await refreshFilesFromServer();
  } catch (e) {
    statusEl.textContent = t('deleteError', file.name, e);
  }
}

// Recomputes only the "Von" column + input "min" attrs from the current
// bisValues, without touching/recreating the input DOM nodes - rebuilding
// them on every keystroke (like renderMappingTable() does) would drop
// focus and, on mobile, dismiss the on-screen keyboard.
function updateVonValues() {
  const rows = Array.from(document.querySelectorAll('#mappingTable tbody tr:not(.empty-row)'));
  let von = 0;
  rows.forEach((tr, i) => {
    const isLast = i === rows.length - 1;
    tr.querySelector('td.von-cell').textContent = von;
    if (!isLast) {
      const input = tr.querySelector('input[type=number]');
      input.min = String(von);
      const name = input.dataset.name;
      von = bisValues[name] !== undefined ? bisValues[name] + 1 : von;
    }
  });
}

function renderMappingTable() {
  const tbody = document.querySelector('#mappingTable tbody');
  tbody.innerHTML = '';

  if (uploadedFiles.length === 0) {
    const tr = document.createElement('tr');
    tr.className = 'empty-row';
    const td = document.createElement('td');
    td.colSpan = 4;
    td.textContent = t('emptyMapping');
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  let von = 0;

  uploadedFiles.forEach((file, i) => {
    const isLast = i === uploadedFiles.length - 1;
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    tdName.dataset.label = t('colFile');
    tdName.className = 'file-cell';
    const nameWrap = document.createElement('span');
    nameWrap.textContent = file.name;
    const sizeSpan = document.createElement('span');
    sizeSpan.className = 'file-size';
    sizeSpan.textContent = ' (' + formatBytes(file.size) + ')';
    nameWrap.appendChild(sizeSpan);
    tdName.appendChild(nameWrap);
    tr.appendChild(tdName);

    const tdVon = document.createElement('td');
    tdVon.textContent = von;
    tdVon.dataset.label = t('colFrom');
    tdVon.className = 'von-cell';
    tr.appendChild(tdVon);

    const tdBis = document.createElement('td');
    tdBis.dataset.label = t('colTo');
    if (isLast) {
      tdBis.textContent = t('unlimited');
    } else {
      const input = document.createElement('input');
      input.type = 'number';
      input.min = String(von);
      input.value = bisValues[file.name] !== undefined ? bisValues[file.name] : '';
      input.dataset.name = file.name;
      input.addEventListener('input', (e) => {
        const val = e.target.value === '' ? undefined : Number(e.target.value);
        if (val === undefined) delete bisValues[file.name];
        else bisValues[file.name] = val;
        updateVonValues();
      });
      tdBis.appendChild(input);
      von = bisValues[file.name] !== undefined ? bisValues[file.name] + 1 : von;
    }
    tr.appendChild(tdBis);

    const tdOrder = document.createElement('td');
    tdOrder.className = 'order-cell';

    const upBtn = document.createElement('button');
    upBtn.type = 'button';
    upBtn.className = 'order-btn';
    upBtn.textContent = '▲';
    upBtn.setAttribute('aria-label', t('moveUp'));
    upBtn.disabled = i === 0;
    upBtn.addEventListener('click', () => moveFile(i, -1));
    tdOrder.appendChild(upBtn);

    const downBtn = document.createElement('button');
    downBtn.type = 'button';
    downBtn.className = 'order-btn';
    downBtn.textContent = '▼';
    downBtn.setAttribute('aria-label', t('moveDown'));
    downBtn.disabled = isLast;
    downBtn.addEventListener('click', () => moveFile(i, 1));
    tdOrder.appendChild(downBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'order-btn delete-btn';
    deleteBtn.textContent = '✕';
    deleteBtn.setAttribute('aria-label', t('deleteFile', file.name));
    deleteBtn.addEventListener('click', () => deleteFile(i));
    tdOrder.appendChild(deleteBtn);

    tr.appendChild(tdOrder);

    tbody.appendChild(tr);
  });
}

async function refreshFilesFromServer() {
  const res = await fetch('/files');
  const data = await res.json();
  uploadedFiles = data.files;
  updateQuotaDisplay(data.total);
  renderMappingTable();
}

async function loadExistingMapping() {
  try {
    const res = await fetch('/mapping');
    const mapping = await res.json();
    Object.keys(mapping).forEach((name) => {
      const bis = mapping[name][1];
      if (bis !== null && bis !== undefined) bisValues[name] = bis;
    });
  } catch (e) {
    console.error('Could not load existing mapping', e);
  }
}

async function loadExistingBtName() {
  try {
    const res = await fetch('/bt_name');
    const name = await res.text();
    if (name) document.getElementById('btName').value = name;
  } catch (e) {
    console.error('Could not load existing BT name', e);
  }
}

async function init() {
  applyStaticTranslations();
  await loadExistingBtName();
  await loadExistingMapping();
  await refreshFilesFromServer();
}

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const input = document.getElementById('fileInput');
  const files = Array.from(input.files);
  if (files.length === 0) return;

  const alreadyUsed = uploadedFiles.reduce((sum, f) => sum + f.size, 0);
  const newTotal = files.reduce((sum, f) => sum + f.size, alreadyUsed);
  if (newTotal > MAX_TOTAL_MP3_BYTES) {
    document.getElementById('uploadStatus').textContent = t('uploadCancelled', formatBytes(newTotal));
    return;
  }

  const uploadBtn = document.getElementById('uploadBtn');
  const statusEl = document.getElementById('uploadStatus');
  uploadBtn.disabled = true;
  for (const file of files) {
    statusEl.textContent = t('uploading', file.name);
    const formData = new FormData();
    formData.append('mp3', file, file.name);
    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      if (!res.ok) {
        const code = await res.text();
        statusEl.textContent = t('uploadError', file.name, errorText(code));
        break;
      }
    } catch (e) {
      statusEl.textContent = t('uploadError', file.name, e);
      break;
    }
  }
  statusEl.textContent = t('uploadDone');
  input.value = '';
  uploadBtn.disabled = false;
  await refreshFilesFromServer();
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  statusEl.className = '';

  const btName = document.getElementById('btName').value.trim();
  if (!btName) {
    statusEl.textContent = t('needBtName');
    statusEl.className = 'error';
    return;
  }
  if (uploadedFiles.length === 0) {
    statusEl.textContent = t('needFile');
    statusEl.className = 'error';
    return;
  }

  const mapping = {};
  let von = 0;
  for (let i = 0; i < uploadedFiles.length; i++) {
    const file = uploadedFiles[i];
    const isLast = i === uploadedFiles.length - 1;
    if (isLast) {
      mapping[file.name] = [von, null];
    } else {
      const bis = bisValues[file.name];
      if (bis === undefined || bis < von) {
        statusEl.textContent = t('needValidTo', file.name, von);
        statusEl.className = 'error';
        return;
      }
      mapping[file.name] = [von, bis];
      von = bis + 1;
    }
  }

  const body = new URLSearchParams();
  body.set('bt_name', btName);
  body.set('mapping_json', JSON.stringify(mapping));

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  try {
    const res = await fetch('/save', { method: 'POST', body });
    const code = await res.text();
    statusEl.textContent = errorText(code);
    statusEl.className = res.ok ? 'ok' : 'error';
  } catch (e) {
    statusEl.textContent = t('saveError', e);
    statusEl.className = 'error';
  } finally {
    saveBtn.disabled = false;
  }
});

init();
</script>
</body>
